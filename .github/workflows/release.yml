name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version (major | minor | patch | premajor | preminor | prepatch | prerelease)'
        default: 'patch'
        required: true
        
permissions:
  contents: read

jobs:
  version:
    name: Create version
    runs-on: ubuntu-latest
    steps:
    - name: Create GitHub App token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        app-id: ${{ secrets.APP_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        owner: ${{ github.repository_owner }}
        repositories: html2canvas
        permission-contents: write
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0
        token: ${{ steps.app-token.outputs.token }}
    - uses: actions/setup-node@v1
      with:
        node-version: 12
    - name: Npm install
      run: npm ci
    - name: Configure git
      run: |
        git config user.name "CI"
        git config user.email "niklasvh@gmail.com"
    - name: Create release
      run: npm run release -- --preset eslint --release-as ${{ github.event.inputs.version }}
    - name: Print details
      run: |
        cat package.json
        cat CHANGELOG.md
        git tag
    - name: Push git version
      run: git push --follow-tags origin master
